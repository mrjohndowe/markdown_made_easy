name: Update changelog

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to add to the changelog
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add to the changelog
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag ${RELEASE_TAG} is not a supported semantic version."
            exit 1
          fi

      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${RELEASE_TAG}" --json body --jq .body > "${RUNNER_TEMP}/release-notes.md"

      - name: Add release to changelog
        id: changelog
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $heading = "## $version"
          $changelogPath = 'CHANGELOG.md'
          $changelog = Get-Content -LiteralPath $changelogPath -Raw

          if ($changelog -match "(?m)^$([regex]::Escape($heading))$") {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "$heading is already present."
            exit 0
          }

          $notes = (Get-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = '- No release notes were provided.'
          }

          $title = '# Changelog'
          if (-not $changelog.StartsWith($title)) {
            throw 'CHANGELOG.md must start with # Changelog.'
          }

          $remainder = $changelog.Substring($title.Length).TrimStart("`r", "`n")
          $updated = "$title`n`n$heading`n`n$notes`n`n$remainder"
          Set-Content -LiteralPath $changelogPath -Value $updated -Encoding utf8
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Commit changelog
        if: steps.changelog.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "Update changelog for ${RELEASE_TAG}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
